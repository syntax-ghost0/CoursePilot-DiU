<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoursePilot Dashboard</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #eef4f8;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #1e293b;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 66px;
        padding: 10px clamp(16px, 4vw, 48px);
        background: rgba(23, 37, 84, 0.97);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
        backdrop-filter: blur(14px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        text-decoration: none;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #60a5fa, #2563eb);
        font-size: 15px;
        font-weight: 900;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.32);
      }
      .brand-copy strong { display: block; font-size: 16px; }
      .brand-copy small { display: block; margin-top: 2px; color: #bfdbfe; font-size: 11px; }
      nav {
        display: flex;
        flex: 1;
        justify-content: flex-end;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      nav::-webkit-scrollbar { display: none; }
      nav a {
        border: 1px solid transparent;
        border-radius: 10px;
        color: #dbeafe;
        padding: 9px 12px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
        transition: 160ms ease;
      }
      nav a:hover { background: rgba(255,255,255,.08); color: white; }
      nav a.active {
        border-color: rgba(147,197,253,.55);
        background: #dbeafe;
        color: #1e3a8a;
        box-shadow: 0 4px 14px rgba(15,23,42,.12);
      }
      iframe {
        width: 100%;
        height: calc(100vh - 106px);
        border: 0;
        display: block;
        background: #eef4f8;
      }
      @media (max-width: 720px) {
        .topbar { align-items: flex-start; flex-direction: column; gap: 8px; }
        .brand-copy { display: none; }
        nav { width: 100%; justify-content: flex-start; }
        nav a { padding: 8px 10px; }
        iframe { height: calc(100vh - 152px); }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="Dashboard.html" aria-label="CoursePilot dashboard">
        <span class="brand-mark">CP</span>
        <span class="brand-copy">
          <strong>CoursePilot</strong>
          <small>Summer 2026</small>
        </span>
      </a>
      <nav aria-label="Primary navigation">
        <a class="active" href="Dashboard.html">Dashboard</a>
        <a href="Routine.html">Routine</a>
        <a href="Courses.html">Courses</a>
        <a href="Teachers.html">Teachers</a>
        <a href="Summary.html">Summary</a>
      </nav>
    </header>
    <iframe src="Class%20Routine.html?view=overview" title="CoursePilot Dashboard"></iframe>
    <footer style="padding:12px 16px; text-align:center; font-size:12px; color:#64748b; background:white;">
      © 2026 Md. Mayen. All Rights Reserved. Unauthorized copying, modification, or distribution of this code is strictly prohibited.
    </footer>
  </body>
</html>
